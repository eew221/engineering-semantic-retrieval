experiment_name: codebrim_eval_full3epoch
seed: 42
device: cuda

data:
  train_csv: data/processed/codebrim/test_single_label.csv
  val_csv: data/processed/codebrim/test_single_label.csv
  test_csv: data/processed/codebrim/test_single_label.csv
  image_column: crop_path
  use_full_image_fallback: true
  image_size: 224
  batch_size: 16
  num_workers: 4

labels:
  damage_classes:
    - background
    - crack
    - spallation
    - efflorescence
    - exposed reinforcement bar
    - corrosion stain
  component_classes:
    - bridge component unknown

model:
  backbone_name: C:/Users/45067/.cache/huggingface/hub/models--openai--clip-vit-base-patch32/snapshots/3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
  embedding_dim: 512
  dropout: 0.1
  freeze_vision_backbone: false
  use_text_anchors: true

train:
  epochs: 3
  lr: 1.0e-5
  weight_decay: 1.0e-4
  temperature: 0.07
  cls_loss_weight: 0.3
  severity_loss_weight: 0.2
  engineering_loss_weight: 1.0
  gradient_clip_norm: 1.0
  pair_weight_mode: engineering
  partner_sampling_strategy: random
  save_dir: outputs/checkpoints

retrieval:
  topk: [1, 5, 10]
  rerank_topn: 20
  rerank_damage_scale: 0.15
  rerank_component_scale: 0.15
  rerank_severity_scale: 0.10
  severity_tolerance: 0.15
  same_component_bonus: 0.0
  same_damage_bonus: 0.4
  severity_bonus_scale: 0.0

output:
  metrics_dir: outputs/metrics
  qualitative_dir: outputs/qualitative
